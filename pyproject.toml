[project]
name = "mojo-zip"
version = "0.1.0"
description = "zipfile read/write for Mojo, pure Mojo: stored + deflate (zlib port), zip64, CRC, CPython zipfile behaviour"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["mojo>=1.2.0,<1.3"]

[project.urls]
Homepage = "https://github.com/amarbaro/mojo-zip"
Repository = "https://github.com/amarbaro/mojo-zip"

[dependency-groups]
dev = []

[tool.mojo]
packages = ["deflate", "zipfile"]  # no C, no dlopen: deflate (zlib port) is part of this repo
